[workspace]
resolver = "2"
members = ["crates/upp-core", "crates/upp", "crates/uppd"]
exclude = ["examples"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/corpunum/unumpingpong"
homepage = "https://github.com/corpunum/unumpingpong"
authors = ["corpunum"]

[workspace.dependencies]
upp-core = { path = "crates/upp-core", version = "0.2.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
lexopt = "0.3"
ratatui = "0.29"
ctrlc = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
