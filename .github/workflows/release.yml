name: Release

# Builds upp + uppd for every supported platform when a version tag (vX.Y.Z) is pushed,
# then publishes them with SHA256SUMS and build-provenance attestations
# (verify with `gh attestation verify <file> --repo corpunum/unumpingpong`).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain (bundled SQLite is C)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Check tag matches the workspace version
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "${TAG%%-*}" ] || [ "v$v" = "$TAG" ] || { echo "tag $TAG != Cargo.toml version $v"; exit 1; }
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin upp --bin uppd
      - name: Package
        id: pkg
        shell: bash
        run: |
          name="unumpingpong-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""; case "${{ matrix.target }}" in *windows*) ext=.exe ;; esac
          cp "target/${{ matrix.target }}/release/upp$ext" "target/${{ matrix.target }}/release/uppd$ext" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cp -r skills packaging examples "dist/$name/"
          cd dist
          case "${{ matrix.target }}" in
            *windows*) 7z a -tzip -bd "$name.zip" "$name" >/dev/null; echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT" ;;
            *) tar -czf "$name.tar.gz" "$name"; echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Smoke test (native targets)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""; case "${{ matrix.target }}" in *windows*) ext=.exe ;; esac
          "target/${{ matrix.target }}/release/upp$ext" --version
          "target/${{ matrix.target }}/release/uppd$ext" --version
          "target/${{ matrix.target }}/release/upp$ext" validate examples/demo/demo.toml > /dev/null
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pkg.outputs.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.file }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cp install.sh install.ps1 dist/
          cd dist && sha256sum unumpingpong-* install.sh install.ps1 > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/SHA256SUMS
      - name: Publish GitHub release
        run: |
          notes="Prebuilt binaries (upp + uppd) for Linux (x86_64, aarch64; static musl), macOS (x86_64, arm64) and Windows (x86_64).

          Install: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh | sh\`
          (Windows: \`irm https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.ps1 | iex\`).
          Every archive is listed in SHA256SUMS and has a build-provenance attestation:
          \`gh attestation verify <archive> --repo ${GITHUB_REPOSITORY}\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "UnumPingPong $TAG" --notes "$notes" --verify-tag
          fi
