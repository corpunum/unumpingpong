name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# One Linux job keeps Actions minutes small: fmt, clippy -D warnings, all tests.
# The integration tests use scripted fake agents (tests/fake-agents), so no model is needed.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - name: Validate examples
        run: for f in examples/*.toml examples/demo/*.toml; do cargo run -q --bin upp -- validate "$f" > /dev/null; done
